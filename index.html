<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0c">
<title>Splat Sequence AR</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: rgba(18,18,20,.78); --line: rgba(255,255,255,.12);
    --fg: #e8e8ea; --dim: #8b8b92; --accent: #f2f2f2;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  body.ar { background: #000; }
  #feed { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  body.ar #feed { display: block; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  #progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent);
    transition: width .15s, opacity .4s; z-index: 30; }

  .hud { position: fixed; z-index: 20; }
  #note { top: calc(10px + var(--safe-t)); left: 12px; right: 12px; color: var(--dim); font-size: 11px;
    letter-spacing: .02em; pointer-events: none; display: flex; justify-content: space-between; gap: 8px; }
  #note b { color: var(--fg); font-weight: 500; }

  #bar { left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); background: var(--panel);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 10px; display: grid; gap: 6px; max-width: 560px; margin: 0 auto; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
    font: inherit; height: 30px; padding: 0 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  button:active { background: rgba(255,255,255,.08); }
  button.on { background: rgba(255,255,255,.12); }
  button.icon { width: 34px; padding: 0; font-size: 14px; }
  .lbl { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 22px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); margin-top: -6px; border: 0; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 0; }
  .spacer { flex: 1; }
  .ar-only { display: none; } body.ar .ar-only { display: inline-flex; align-items: center; }

  #xform { right: 10px; bottom: calc(108px + var(--safe-b)); background: var(--panel);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; display: none; width: 236px; }
  #xform.open { display: block; }
  #xform .g { display: grid; grid-template-columns: 34px repeat(3, 1fr); gap: 5px; align-items: center; }
  #xform .h { color: var(--dim); font-size: 10px; text-align: center; text-transform: uppercase; letter-spacing: .06em; }
  #xform .k { color: var(--dim); font-size: 11px; }
  #xform input { width: 100%; min-width: 0; height: 26px; background: rgba(0,0,0,.35); border: 1px solid var(--line);
    border-radius: 6px; color: var(--fg); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 0 5px; text-align: right; -webkit-user-select: text; user-select: text; }
  #xform input:focus { outline: none; border-color: rgba(255,255,255,.4); }

  #start { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: var(--bg); padding: 24px; text-align: center; }
  #start.hide { display: none; }
  #start h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .02em; }
  #start p { margin: 0; color: var(--dim); max-width: 300px; font-size: 12px; }
  #start .big { height: 40px; padding: 0 22px; font-size: 14px; border-color: rgba(255,255,255,.3); }
  #start .link { border: 0; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; height: auto; }
  #loadtxt { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; min-height: 14px; }
  #err { color: #ff8a80; font-size: 12px; max-width: 320px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
  }
}
</script>
</head>
<body>
<video id="feed" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<div id="progress"></div>

<div id="note" class="hud"><span id="mode"></span><span id="stat"></span></div>

<div id="xform" class="hud">
  <div class="g">
    <span></span><span class="h">x</span><span class="h">y</span><span class="h">z</span>
    <span class="k">pos</span><input data-k="px" inputmode="decimal"><input data-k="py" inputmode="decimal"><input data-k="pz" inputmode="decimal">
    <span class="k">rot°</span><input data-k="rx" inputmode="decimal"><input data-k="ry" inputmode="decimal"><input data-k="rz" inputmode="decimal">
    <span class="k">scale</span><input data-k="s" inputmode="decimal"><span></span><span></span>
  </div>
</div>

<div id="bar" class="hud">
  <div class="row">
    <button id="play" class="icon" aria-label="Play/pause">❚❚</button>
    <input id="scrub" type="range" min="0" max="14" step="1" value="0" aria-label="Frame">
    <span id="flbl" class="lbl">01/15</span>
  </div>
  <div class="row">
    <span class="lbl" style="min-width:0">fps</span>
    <input id="fps" type="range" min="1" max="24" step="1" value="5" aria-label="Frames per second" style="max-width:120px">
    <span id="fpslbl" class="lbl" style="min-width:18px;text-align:left">5</span>
    <span class="spacer"></span>
    <button id="place" class="ar-only">Place</button>
    <button id="xbtn">Transform</button>
    <button id="reset">Reset</button>
  </div>
</div>

<div id="start">
  <h1>Splat Sequence AR</h1>
  <p id="intro">Rear camera with rotation tracking only — the object follows your phone's orientation, not your position. Turn, don't walk.</p>
  <button id="go" class="big" disabled>Loading…</button>
  <button id="nocam" class="link">View without camera</button>
  <div id="loadtxt"></div>
  <div id="err"></div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// ---------- config ----------
const params = new URLSearchParams(location.search);
const LITE = params.get("lite") === "1";
const FRAME_COUNT = 15;
const FRAME_DIR = LITE ? "frames-lite/" : "frames/";
const FRAME_URLS = Array.from({ length: FRAME_COUNT }, // Absolute URLs: Spark fetches inside a blob: worker where relative paths don't resolve.
  (_, i) => new URL(`${FRAME_DIR}${String(i + 1).padStart(4, "0")}.spz`, location.href).href);
const EST_BYTES = LITE ? 1.0e6 : 1.9e6;     // per-file fallback if Content-Length is missing
const PLACE_DIST = 1.5;
const CAM_LONG_FOV = 66;                    // deg, iPhone main camera along the long image side (approx.)
const $ = (id) => document.getElementById(id);

const isTouch = matchMedia("(pointer: coarse)").matches;
const canAR = isTouch && !!navigator.mediaDevices?.getUserMedia && "DeviceOrientationEvent" in window;

// ---------- three / spark ----------
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 2 : 2));
renderer.setClearColor(0x0b0b0c, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 200);
const spark = new SparkRenderer({ renderer });
scene.add(spark);

const root = new THREE.Group();          // the user-transformable object
root.rotation.order = "YXZ";
scene.add(root);

let mode = "orbit";                      // "orbit" | "ar"
let controls = null;

// ---------- transform state ----------
const DEFAULTS = {
  orbit: { px: 0, py: 0, pz: 0, rx: 0, ry: 180, rz: 0, s: 1 },
  ar:    { px: 0, py: 0, pz: -PLACE_DIST, rx: 0, ry: 180, rz: 0, s: 1 },
};
const key = () => `splat-ar:v1:${mode}`;
function loadSaved() {
  try { const v = JSON.parse(localStorage.getItem(key()) || "null"); if (v && typeof v === "object") return v; } catch {}
  return null;
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(key(), JSON.stringify({ ...getT(), fps })); } catch {}
  }, 250);
}
const D = THREE.MathUtils.DEG2RAD, R = THREE.MathUtils.RAD2DEG;
function getT() {
  return { px: root.position.x, py: root.position.y, pz: root.position.z,
           rx: root.rotation.x * R, ry: root.rotation.y * R, rz: root.rotation.z * R, s: root.scale.x };
}
function setT(t) {
  root.position.set(+t.px || 0, +t.py || 0, +t.pz || 0);
  root.rotation.set((+t.rx || 0) * D, (+t.ry || 0) * D, (+t.rz || 0) * D);
  const s = Math.min(50, Math.max(0.01, +t.s || 1));
  root.scale.setScalar(s);
  syncPanel(); save();
}

// ---------- transform panel ----------
const inputs = [...document.querySelectorAll("#xform input")];
const fmt = (k, v) => (k === "s" ? v.toFixed(3) : k[0] === "r" ? normDeg(v).toFixed(1) : v.toFixed(3));
const normDeg = (d) => ((((d + 180) % 360) + 360) % 360) - 180;
function syncPanel() {
  if (!$("xform").classList.contains("open")) return;
  const t = getT();
  for (const el of inputs) if (document.activeElement !== el) el.value = fmt(el.dataset.k, t[el.dataset.k]);
}
for (const el of inputs) {
  el.addEventListener("change", () => {
    const v = parseFloat(el.value.replace(",", "."));
    if (!Number.isFinite(v)) return syncPanel();
    setT({ ...getT(), [el.dataset.k]: v });
  });
  el.addEventListener("keydown", (e) => { if (e.key === "Enter") el.blur(); });
}
$("xbtn").onclick = () => { $("xform").classList.toggle("open"); $("xbtn").classList.toggle("on"); syncPanel(); };

// ---------- frames ----------
const frames = [];
let cur = 0, playing = true, fps = 5, acc = 0;
function showFrame(i) {
  i = ((i % FRAME_COUNT) + FRAME_COUNT) % FRAME_COUNT;
  if (frames[cur]) frames[cur].visible = false;
  cur = i;
  if (frames[cur]) frames[cur].visible = true;
  $("scrub").value = String(cur);
  $("flbl").textContent = `${String(cur + 1).padStart(2, "0")}/${FRAME_COUNT}`;
}
function setPlaying(p) { playing = p; $("play").textContent = p ? "❚❚" : "▶"; acc = 0; }
function setFps(v) { fps = Math.min(24, Math.max(1, Math.round(v) || 5)); $("fps").value = String(fps); $("fpslbl").textContent = String(fps); }
$("play").onclick = () => setPlaying(!playing);
$("scrub").oninput = (e) => { setPlaying(false); showFrame(+e.target.value); };
$("fps").oninput = (e) => { setFps(+e.target.value); save(); };

async function preload() {
  const loaded = new Array(FRAME_COUNT).fill(0);
  const total = new Array(FRAME_COUNT).fill(EST_BYTES);
  let decoded = 0;
  const report = () => {
    const bytes = loaded.reduce((a, b) => a + b, 0), all = total.reduce((a, b) => a + b, 0);
    const p = 0.85 * Math.min(1, bytes / all) + 0.15 * (decoded / FRAME_COUNT);
    $("progress").style.width = `${(p * 100).toFixed(1)}%`;
    $("loadtxt").textContent = decoded === FRAME_COUNT ? "" :
      `${(bytes / 1e6).toFixed(1)} / ${(all / 1e6).toFixed(0)} MB · ${decoded}/${FRAME_COUNT} frames${LITE ? " · lite" : ""}`;
  };
  report();
  // Limited concurrency keeps peak memory (raw bytes + decode buffers) down on iOS.
  let next = 0;
  async function worker() {
    while (next < FRAME_COUNT) {
      const i = next++;
      const mesh = new SplatMesh({
        url: FRAME_URLS[i],
        lod: false,
        onProgress: (e) => { loaded[i] = e.loaded; if (e.lengthComputable && e.total) total[i] = e.total; report(); },
      });
      mesh.visible = false;
      frames[i] = mesh;
      root.add(mesh);
      await mesh.initialized;
      loaded[i] = total[i]; decoded++; report();
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  showFrame(0);
  $("progress").style.opacity = "0";
}

// ---------- device orientation (AR) ----------
const devQ = new THREE.Quaternion(), tgtQ = new THREE.Quaternion();
const _e = new THREE.Euler(), _q0 = new THREE.Quaternion(), _z = new THREE.Vector3(0, 0, 1);
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // camera looks out the back, not the top
let gotOrientation = false, firstQ = true;
function screenAngle() { return ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * D; }
function onOrient(ev) {
  if (ev.alpha == null) return;
  _e.set(ev.beta * D, ev.alpha * D, -ev.gamma * D, "YXZ");
  tgtQ.setFromEuler(_e).multiply(_q1).multiply(_q0.setFromAxisAngle(_z, -screenAngle()));
  if (firstQ) { devQ.copy(tgtQ); firstQ = false; }
  gotOrientation = true;
}

function updateFov() {
  const W = innerWidth, H = innerHeight;
  if (mode === "ar") {
    const v = $("feed"), vw = v.videoWidth, vh = v.videoHeight;
    if (vw && vh) {
      const f = (Math.max(vw, vh) / 2) / Math.tan((CAM_LONG_FOV * D) / 2);   // focal in video px
      const s = Math.max(W / vw, H / vh);                                     // object-fit: cover
      camera.fov = 2 * Math.atan((H / 2) / (f * s)) * R;
    } else camera.fov = W < H ? 60 : 40;
  } else camera.fov = 50;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); updateFov(); }
addEventListener("resize", resize);
$("feed").addEventListener("loadedmetadata", updateFov);
$("feed").addEventListener("resize", updateFov);

// ---------- placement ----------
const _dir = new THREE.Vector3();
function place() {
  camera.getWorldDirection(_dir);
  const p = camera.position.clone().addScaledVector(_dir, PLACE_DIST);
  // Face the viewer: the splat's front is local -z (where SHARP's source camera was).
  const yaw = Math.atan2(_dir.x, _dir.z) * R;
  setT({ ...getT(), px: p.x, py: p.y, pz: p.z, ry: yaw });
}
$("place").onclick = place;
$("reset").onclick = () => {
  setT(DEFAULTS[mode]);
  if (mode === "ar") place();
  else if (controls) { camera.position.set(0, 0.25, 2.2); controls.target.set(0, 0, 0); controls.update(); }
};

// ---------- touch gestures (AR) ----------
const ptrs = new Map();
let g = null; // gesture baseline
function baseline() {
  const pts = [...ptrs.values()];
  if (pts.length === 1) g = { n: 1, x: pts[0].x, ry: root.rotation.y };
  else if (pts.length >= 2) {
    const [a, b] = pts;
    g = { n: 2, d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
          s: root.scale.x, pos: root.position.clone() };
  } else g = null;
}
canvas.addEventListener("pointerdown", (e) => {
  if (mode !== "ar") return;
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); baseline();
});
const _right = new THREE.Vector3(), _up = new THREE.Vector3();
canvas.addEventListener("pointermove", (e) => {
  if (mode !== "ar" || !ptrs.has(e.pointerId) || !g) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pts = [...ptrs.values()];
  if (g.n === 1 && pts.length === 1) {
    root.rotation.y = g.ry + (pts[0].x - g.x) * 0.01;
  } else if (g.n === 2 && pts.length >= 2) {
    const [a, b] = pts;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    root.scale.setScalar(Math.min(50, Math.max(0.01, g.s * d / g.d)));
    // Two-finger drag moves in the camera's screen plane at the object's depth.
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dist = Math.max(0.1, g.pos.distanceTo(camera.position));
    const k = (2 * dist * Math.tan((camera.fov * D) / 2)) / innerHeight;
    _right.setFromMatrixColumn(camera.matrixWorld, 0);
    _up.setFromMatrixColumn(camera.matrixWorld, 1);
    root.position.copy(g.pos).addScaledVector(_right, (mx - g.mx) * k).addScaledVector(_up, -(my - g.my) * k);
  }
  syncPanel(); save();
});
const endPtr = (e) => { if (ptrs.delete(e.pointerId)) baseline(); };
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---------- modes ----------
function enterOrbit() {
  mode = "orbit";
  document.body.classList.remove("ar");
  renderer.setClearColor(0x0b0b0c, 1);
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  camera.position.set(0, 0.25, 2.2);
  controls.target.set(0, 0, 0);
  controls.update();
  const s = loadSaved(); setT(s || DEFAULTS.orbit); if (s?.fps) setFps(s.fps);
  $("mode").innerHTML = "<b>3D view</b> · drag to orbit, pinch/scroll to zoom";
  $("start").classList.add("hide");
  resize();
}

async function enterAR() {
  $("err").textContent = "";
  // Both permission prompts must be triggered synchronously inside the tap.
  const permP = typeof DeviceOrientationEvent.requestPermission === "function"
    ? DeviceOrientationEvent.requestPermission() : Promise.resolve("granted");
  const camP = navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
  });
  let stream;
  try {
    const [perm, s] = await Promise.all([permP, camP]);
    stream = s;
    if (perm !== "granted") throw new Error("Motion access was denied. Reload and allow it to track rotation.");
  } catch (err) {
    stream?.getTracks().forEach((t) => t.stop());
    $("err").textContent = err?.name === "NotAllowedError" ? "Camera or motion access was denied." : String(err?.message || err);
    return;
  }
  const v = $("feed");
  v.srcObject = stream;
  try { await v.play(); } catch {}
  mode = "ar";
  document.body.classList.add("ar");
  renderer.setClearColor(0x000000, 0);
  camera.position.set(0, 0, 0);
  addEventListener("deviceorientation", onOrient);
  const s = loadSaved(); if (s?.fps) setFps(s.fps);
  setT(s || DEFAULTS.ar);
  $("mode").innerHTML = "<b>Rotation tracking only</b> · no position tracking";
  $("start").classList.add("hide");
  resize();
  // Heading resets each session, so put the object in front once the first reading arrives.
  const t0 = performance.now();
  (function waitOrient() {
    if (gotOrientation) { camera.quaternion.copy(tgtQ); camera.updateMatrixWorld(); place(); return; }
    if (performance.now() - t0 > 1500) { $("mode").innerHTML = "<b>No motion data</b> · orientation sensor unavailable"; return; }
    requestAnimationFrame(waitOrient);
  })();
}

// ---------- loop ----------
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.25);
  if (playing && frames.length === FRAME_COUNT && frames.every(Boolean)) {
    acc += dt;
    const step = 1 / fps;
    if (acc >= step) { const n = Math.floor(acc / step); acc -= n * step; showFrame(cur + n); }
  }
  if (mode === "ar") { devQ.slerp(tgtQ, 0.6); camera.quaternion.copy(devQ); }
  else controls?.update();
  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 1) { $("stat").textContent = `${Math.round(fpsN / fpsAcc)} fps render${LITE ? " · lite" : ""}`; fpsAcc = 0; fpsN = 0; }
});

// ---------- boot ----------
resize();
setFps(5);
if (!canAR) {
  enterOrbit();
} else {
  $("nocam").onclick = enterOrbit;
  $("go").onclick = enterAR;
}
if (!LITE) $("intro").insertAdjacentHTML("beforeend",
  ` <br><br>If Safari reloads or crashes, try <a href="?lite=1" style="color:inherit">lite mode</a> (75k splats per frame).`);
preload().then(() => {
  $("go").disabled = false; $("go").textContent = "Start camera";
}).catch((err) => {
  console.error(err);
  $("err").textContent = `Failed to load frames: ${err?.message || err}`;
  $("start").classList.remove("hide");
});
</script>
</body>
</html>
